# Fetch a daily US market snapshot into data/
name: snapshot

on:
  workflow_dispatch: {}
  schedule:
    - cron: "40 20 * * 1-5"
    - cron: "40 21 * * 1-5"
    - cron: "45 4 * * 1-5"

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install yfinance pandas requests lxml
      - name: Fetch
        run: python fetch/fetch_market.py
      - name: Commit
        run: |
          git config user.name "snapshot-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)" || echo "no changes"
          git pull --rebase
          git push
